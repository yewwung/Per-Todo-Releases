name: Publish Per Todo 2.4.10

on:
  push:
    tags:
      - "v2.4.10"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release assets
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/Per Todo_2.4.10_x64-setup.exe" \
            "release-assets/Per Todo_2.4.10_x64-setup.exe.sig" \
            "release-assets/Per Todo_2.4.10_x64-portable.zip" \
            "release-assets/latest.json" \
            --title "Per Todo 2.4.10" \
            --notes-file RELEASE_NOTES.md \
            --latest
