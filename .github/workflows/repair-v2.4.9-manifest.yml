name: Repair v2.4.9 updater manifest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-v2.4.9-manifest.yml"
      - "release-assets/latest.json"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release assets
        uses: actions/checkout@v4

      - name: Replace updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.4.9 release-assets/latest.json --clobber
